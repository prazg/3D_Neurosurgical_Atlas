name: Validate & Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js (for JS syntax check)
        uses: actions/setup-node@v7
        with:
          node-version: "22""

      - name: Validate HTML, JS, GLB meshes, lookups & cross-references
        run: python validate_atlas.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage static site bundle
        run: |
          mkdir -p _site
          cp index.html atlas.html mobile.html manifest.json approaches.json figures.json rhoton.json NOTICE LICENSE.md _site/
          for f in *.glb; do
            if [ "$f" != "craniospinal.glb" ]; then
              cp "$f" _site/
            fi
          done
          cp -r img _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
